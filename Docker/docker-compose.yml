services:

  database:
    image: postgres:17-alpine
    container_name: database
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB=interkom
    restart: unless-stopped
    ports:
      - 5999:5432
    networks:
      - interkom
    volumes:
      - pgdata:/var/lib/postgresql/data

  interkom-server:
    build:
      context: .
      args:
        - GIT_BRANCH
    image: interkom-server
    container_name: interkomServer
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/interkom
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FRONTEND_URI: ${INTERKOM_URL}
      FRONTEND_PORT: ${WEB_PORT}
    restart: unless-stopped
    depends_on: 
      - database
    networks:
      - interkom
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  reverse-proxy:
    restart: always
    depends_on:
      interkom-server:
        condition: service_healthy
    image: nginx:latest
    container_name: revproxy
    env_file:
      - .env
    environment:
      - INTERKOM_SERVER_URL=${INTERKOM_URL}
    networks:
      - interkom
    ports:
      - ${WEB_PORT}:443
      - 80:80
    volumes:
      - ./nginx.conf.d/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    restart: always
    depends_on:
      - reverse-proxy
    networks:
      - interkom
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot

volumes:
  pgdata:

networks:
  interkom:
