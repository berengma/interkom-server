services:

  database:
    image: postgres:17-alpine
    container_name: database
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB=interkom
    restart: unless-stopped
    ports:
      - 5999:5432
    networks:
      - interkom
    volumes:
      - pgdata:/var/lib/postgresql/data

  interkom-server:
    build: ./
    image: interkom-server
    container_name: interkomServer
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/interkom
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      FRONTEND_URI: ${INTERKOM_URL}
      FRONTEND_PORT: ${WEB_PORT}
    restart: unless-stopped
    depends_on: 
      - database
    networks:
      - interkom

  reverse-proxy:
    restart: always
    depends_on:
      - interkom-server
    image: nginx:latest
    container_name: revproxy
    environment:
      - INTERKOM_SERVER_URL=${INTERKOM_URL}
    networks:
      - interkom
    ports:
      - ${WEB_PORT}:80
    volumes:
      - ./nginx.conf.d:/etc/nginx/conf.d:ro

volumes:
  pgdata:

networks:
  interkom:
